<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validação de Sites</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">LEAD CERTO</div>
      <h1>Validação de sites</h1>
      <p>Cole um link por linha.</p>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="approve" role="tab">APROVAR</button>
      <button class="tab" data-tab="invalidate" role="tab">INVALIDAR</button>
    </nav>

    <section class="panel active" data-panel="approve">
      <textarea id="approveText" placeholder="https://empresa1.com.br&#10;https://empresa2.com.br" spellcheck="false"></textarea>
      <div class="counter" id="approveCounter">0 links</div>
      <div class="actions">
        <button class="secondary" data-clear="approve">LIMPAR</button>
        <button class="primary approve" data-submit="approve">APROVAR LEADS</button>
      </div>
      <div class="result" id="approveResult" aria-live="polite"></div>
    </section>

    <section class="panel" data-panel="invalidate">
      <textarea id="invalidateText" placeholder="https://empresa1.com.br&#10;https://empresa2.com.br" spellcheck="false"></textarea>
      <div class="counter" id="invalidateCounter">0 links</div>
      <div class="actions">
        <button class="secondary" data-clear="invalidate">LIMPAR</button>
        <button class="primary invalidate" data-submit="invalidate">INVALIDAR LEADS</button>
      </div>
      <div class="result" id="invalidateResult" aria-live="polite"></div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
