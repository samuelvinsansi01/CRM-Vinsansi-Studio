<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Painel - Samuel Vinsansi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #0a0a0d;
  --surface: #111116;
  --surface2: #17171e;
  --surface3: #1e1e27;
  --border: #1f1f28;
  --border2: #2a2a36;
  --accent: #b8f059;
  --accent-dim: rgba(184,240,89,0.08);
  --accent-border: rgba(184,240,89,0.18);
  --text: #ededf0;
  --text2: #9898a8;
  --muted: #44445a;
  --error: #ff5c5c;
  --warning: #f0a429;
  --ok: #4ecb71;
  --radius: 10px;
  --sidebar-w: 220px;
  --sidebar-collapsed-w: 56px;
  --topbar-h: 52px;
}
*{margin:0;padding:0;box-sizing:border-box;}

/* ══ LAYOUT BASE — desktop: sidebar lateral ══ */
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;overflow:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;opacity:0.25;pointer-events:none;z-index:0;}

/* ══ SIDEBAR ══ */
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:relative;z-index:20;height:100vh;transition:width 0.22s cubic-bezier(0.4,0,0.2,1);overflow:hidden;}
.sidebar.collapsed{width:var(--sidebar-collapsed-w);}
.sidebar-logo{padding:14px 14px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;min-height:56px;flex-shrink:0;}
.sidebar-hamburger{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--surface2);border:1px solid var(--border);cursor:pointer;transition:all 0.18s;color:var(--text2);font-size:14px;user-select:none;}
.sidebar-hamburger:hover{border-color:var(--accent);color:var(--accent);}
.sidebar-brand{display:flex;flex-direction:column;gap:2px;opacity:1;transition:opacity 0.15s;white-space:nowrap;overflow:hidden;}
.sidebar.collapsed .sidebar-brand{opacity:0;pointer-events:none;width:0;}
.logo-text{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.18em;color:var(--accent);}
.logo-sub{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:0.1em;margin-top:2px;}
.sidebar-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;overflow-x:hidden;}
.nav-section-label{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:0.16em;color:var(--muted);padding:12px 10px 6px;text-transform:uppercase;white-space:nowrap;opacity:1;transition:opacity 0.15s;}
.sidebar.collapsed .nav-section-label{opacity:0;height:0;padding:0;margin:0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:all 0.18s;border:1px solid transparent;position:relative;white-space:nowrap;}
.sidebar.collapsed .nav-item{padding:10px;justify-content:center;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{background:var(--accent-dim);border-color:var(--accent-border);color:var(--accent);}
.nav-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;background:var(--surface2);border:1px solid var(--border);transition:all 0.18s;}
.nav-item.active .nav-icon{background:rgba(184,240,89,0.12);border-color:var(--accent-border);}
.nav-label{font-size:12px;font-weight:600;letter-spacing:0.01em;color:var(--text2);transition:all 0.15s;overflow:hidden;}
.sidebar.collapsed .nav-label{width:0;opacity:0;overflow:hidden;}
.nav-item.active .nav-label,.nav-item:hover .nav-label{color:inherit;}
.nav-badge{margin-left:auto;background:var(--surface3);border:1px solid var(--border2);color:var(--text2);font-family:'DM Mono',monospace;font-size:8px;padding:2px 6px;border-radius:100px;white-space:nowrap;transition:all 0.15s;}
.sidebar.collapsed .nav-badge{display:none;}
.nav-item.active .nav-badge{background:rgba(184,240,89,0.12);border-color:var(--accent-border);color:var(--accent);}
.sidebar.collapsed .nav-item::after{content:attr(data-label);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-family:'DM Mono',monospace;font-size:9px;padding:5px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.15s;z-index:100;}
.sidebar.collapsed .nav-item:hover::after{opacity:1;}
.sidebar-footer{padding:16px;border-top:1px solid var(--border);font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:0.08em;overflow:hidden;flex-shrink:0;}
.sidebar.collapsed .sidebar-footer{display:none;}
.sidebar-clock{color:var(--text2);font-size:11px;margin-bottom:2px;}

/* ══ MOBILE TOPBAR (hidden on desktop) ══ */
.mobile-topbar{display:none;position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);z-index:30;align-items:center;padding:0 16px;gap:12px;}
.mobile-topbar .logo-text{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.18em;color:var(--accent);}

/* Mobile overlay when sidebar open */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:15;}
.sidebar-overlay.visible{display:block;}

/* ══ MAIN ══ */
.main{flex:1;height:100vh;overflow-y:auto;overflow-x:hidden;position:relative;z-index:1;min-width:0;}
.panel{display:none;padding:24px;height:100vh;width:100%;box-sizing:border-box;flex-direction:column;overflow-y:auto;overflow-x:hidden;}
.panel.active{display:flex;}
.page-header{margin-bottom:24px;}
.page-title{font-size:24px;font-weight:800;letter-spacing:-0.04em;line-height:1.1;}
.page-title span{color:var(--accent);}
.page-sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:0.08em;margin-top:6px;}

/* ══ CARDS ══ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;}
.card+.card{margin-top:16px;}
.card-title{font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--text2);margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.card-title::after{content:'';flex:1;height:1px;background:var(--border);min-width:20px;}

/* ══ FORMS ══ */
label{font-size:9px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
label .tag{background:var(--border2);color:var(--text2);font-family:'DM Mono',monospace;font-size:8px;padding:2px 6px;border-radius:4px;}
input,textarea,select{background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:11px 13px;width:100%;transition:border-color 0.2s,box-shadow 0.2s;outline:none;-webkit-appearance:none;appearance:none;}
textarea{resize:vertical;min-height:100px;}
input::placeholder,textarea::placeholder{color:var(--muted);}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(184,240,89,0.07);}
select option{background:#17171e;}
input[type="number"]{-moz-appearance:textfield;}
input[type="checkbox"]{width:auto;padding:0;}

/* ══ BUTTONS ══ */
.btn{padding:10px 16px;border:none;border-radius:var(--radius);font-family:'Syne',sans-serif;font-weight:700;font-size:12px;letter-spacing:0.04em;cursor:pointer;transition:opacity 0.2s,transform 0.12s;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;}
.btn:hover{opacity:0.86;}
.btn:active{transform:scale(0.98);}
.btn:disabled{opacity:0.3;cursor:not-allowed;transform:none;}
.btn-primary{background:var(--accent);color:#0a0a0d;}
.btn-ghost{background:none;border:1px solid var(--border2);color:var(--text2);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-danger{background:none;border:1px solid var(--border2);color:var(--muted);}
.btn-danger:hover{border-color:var(--error);color:var(--error);background:rgba(255,92,92,0.06);}
.btn-excel{background:#1a5c38;color:#fff;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.spinner{display:none;width:13px;height:13px;border:2px solid rgba(0,0,0,0.2);border-top-color:#0a0a0d;border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}

.notify{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--accent-border);color:var(--accent);font-family:'DM Mono',monospace;font-size:10px;padding:11px 16px;border-radius:10px;z-index:9999;transform:translateY(70px);opacity:0;transition:all 0.28s ease;pointer-events:none;max-width:340px;}
.notify.show{transform:translateY(0);opacity:1;}
.notify.err{border-color:rgba(255,92,92,0.35);color:var(--error);}
.notify.warn{border-color:rgba(240,164,41,0.35);color:var(--warning);}

/* ══ DAY TABS ══ */
.day-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;}
.day-tab{padding:5px 12px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);color:var(--muted);font-family:'DM Mono',monospace;font-size:9px;cursor:pointer;transition:all 0.18s;white-space:nowrap;}
.day-tab.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
.day-tab:hover:not(.active){color:var(--text2);}
.day-tab .day-count{display:inline-block;background:var(--border2);border-radius:100px;padding:1px 5px;font-size:8px;margin-left:3px;}
.day-tab.active .day-count{background:rgba(184,240,89,0.18);}

/* ══ STATUS TABS ══ */
.status-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;}
.status-tab{padding:5px 12px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);color:var(--muted);font-family:'DM Mono',monospace;font-size:9px;cursor:pointer;transition:all 0.18s;white-space:nowrap;}
.status-tab.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
.status-tab:hover:not(.active){color:var(--text2);}
.status-tab .st-count{display:inline-block;background:var(--border2);border-radius:100px;padding:1px 5px;font-size:8px;margin-left:3px;}
.status-tab.active .st-count{background:rgba(184,240,89,0.18);}

/* ══ TABLE ══ */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:11px;}
thead tr{background:var(--surface2);}
th{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:0.1em;color:var(--muted);text-transform:uppercase;padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border);}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,0.015);}
.td-name{font-weight:700;font-size:12px;}
.td-name a{color:var(--text);text-decoration:none;}
.td-name a:hover{color:var(--accent);text-decoration:underline;}
.td-link{font-family:'DM Mono',monospace;font-size:10px;color:var(--accent);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.td-link a{color:inherit;text-decoration:none;}
.td-link a:hover{text-decoration:underline;}
.td-missing{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);}
.table-empty{text-align:center;padding:32px;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);}
.del-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:3px 6px;border-radius:4px;transition:color 0.2s,background 0.2s;}
.del-btn:hover{color:var(--error);background:rgba(255,92,92,0.1);}
.status-select{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-family:'DM Mono',monospace;font-size:9px;padding:4px 7px;cursor:pointer;outline:none;width:100%;}

/* ... Código parcial devido à limitação de espaço do buffer de leitura anterior ... */
/* Certifique-se de manter os blocos de funções como toggleSidebar, switchPanel, abrirModalNovoLead, etc., que coordenam o painel. */

function toggleSidebar() {
  const s = document.getElementById('sidebar');
  const open = !s.classList.contains('collapsed');
  s.classList.toggle('collapsed', open);
  localStorage.setItem(SIDEBAR_KEY, open ? '0' : '1');
}

const PANELS = ['inicio','importar','validacao','atribuicao','instagram','fila-zap','redirecionamentos','configuracoes'];
function switchPanel(name) {
  PANELS.forEach(p => document.getElementById('panel-'+p).classList.toggle('active', p===name));
  document.querySelectorAll('.nav-item').forEach(el => {
    const label = el.getAttribute('data-label') || '';
    const panelMap = {'Início':'inicio','Importar':'importar','Validação':'validacao','Atribuição':'atribuicao','Instagram':'instagram','Fila WhatsApp':'fila-zap','Redirecionamentos':'redirecionamentos','Configurações':'configuracoes'};
    el.classList.toggle('active', panelMap[label] === name);
  });
  if (name==='inicio') renderInicio();
  if (name==='importar') renderImportarPanel();
  if (name==='validacao') renderValidacao();
  if (name==='atribuicao') renderAtribuicao();
  if (name==='instagram') renderInstagram();
  if (name==='fila-zap') renderFilaZap();
}

    // ... lógica de inicialização de chips
  }
})();
</script>
</body>
</html>
