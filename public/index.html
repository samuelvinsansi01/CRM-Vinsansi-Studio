<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CRM de Prospecção</title>
  <link rel="stylesheet" href="css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <section id="authLoggedOut" class="auth-screen" hidden>
    <div class="auth-card">
      <h1>CRM de Prospecção</h1>
      <p>Entre para acessar a nova base conectada ao Supabase.</p>
      <button id="btnGoogleLogin" class="primary-btn">Entrar com Google</button>
      <p id="bootStatus"></p>
    </div>
  </section>

  <section id="appShell" class="app-shell" hidden>
    <header class="topbar">
      <strong>CRM de Prospecção</strong>
      <div>
        <span id="userEmail"></span>
        <button id="btnLogout" class="ghost-btn">Sair</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <nav>
          <a href="#dashboard">Dashboard</a>
          <a href="#leads">Leads</a>
          <a href="#fila">Fila</a>
          <a href="#conversas">Conversas</a>
          <a href="#crm">CRM</a>
        </nav>
      </aside>

      <section class="content">
        <p id="bootStatus">Iniciando...</p>
        <section id="dashboard" class="panel">
          <h1>Dashboard</h1>
          <div id="dashboardCounts" class="metric-grid"></div>
        </section>

        <section id="leads" class="panel">
          <h2>Leads do banco novo</h2>
          <div id="leadsList" class="lead-list"></div>
        </section>
      </section>
    </main>
  </section>

  <aside id="leadDrawer" class="drawer" hidden>
    <div class="drawer-panel">
      <div class="drawer-header">
        <button id="closeLeadDrawer" class="ghost-btn">Fechar</button>
      </div>
      <div id="leadDrawerBody"></div>
    </div>
  </aside>

  <script src="js/core/crm-config.js"></script>
  <script src="js/core/app-state.js"></script>
  <script src="js/core/supabase-client.js"></script>
  <script src="js/core/db-client.js"></script>
  <script src="js/core/auth-guard.js"></script>
  <script src="js/core/indexeddb-images.js"></script>
  <script src="js/repositories/settings-repository.js"></script>
  <script src="js/repositories/leads-repository.js"></script>
  <script src="js/repositories/lead-events-repository.js"></script>
  <script src="js/repositories/whatsapp-repository.js"></script>
  <script src="js/services/bootstrap-service.js"></script>
  <script src="js/services/settings-service.js"></script>
  <script src="js/services/lead-service.js"></script>
  <script src="js/pages/dashboard-page.js"></script>
  <script src="js/pages/leads-page.js"></script>
  <script src="js/pages/lead-drawer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
